name: Build Caper Debian Package

on:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuild even if commit has not changed'
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [caper_commit]
  push:
    paths:
      - '.github/workflows/caper-deb.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for new Caper commit
        id: check_commit
        run: |
          latest_sha=$(git ls-remote https://git.disroot.org/jimedrand/caper HEAD | cut -f1)
          short_sha=${latest_sha:0:6}
          if [ -z "$short_sha" ]; then
            exit 1
          fi
          if [ "${{ inputs.force_build }}" = "true" ]; then
            echo "has_new_commit=true" >> "$GITHUB_OUTPUT"
          elif compgen -G "caper-deb/*-${short_sha}_all.deb" > /dev/null; then
            echo "has_new_commit=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_new_commit=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build dependencies
        if: steps.check_commit.outputs.has_new_commit == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev

      - name: Clone caper repository
        if: steps.check_commit.outputs.has_new_commit == 'true'
        run: |
          git clone https://git.disroot.org/jimedrand/caper

      - name: Build Debian package
        if: steps.check_commit.outputs.has_new_commit == 'true'
        run: |
          cd caper
          make deb

      - name: Replace Caper Debian package
        if: steps.check_commit.outputs.has_new_commit == 'true'
        run: |
          mkdir -p caper-deb
          rm -f caper-deb/*.deb
          cp caper/*.deb caper-deb/

      - name: Commit and push new package
        if: steps.check_commit.outputs.has_new_commit == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add caper-deb/*.deb
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "Update Caper Debian package"
          git push
