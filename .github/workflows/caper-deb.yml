name: Build Caper Debian Package

on:
  schedule:
    - cron: '0 0 * * *' # daily at midnight UTC
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/caper-deb.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential devscripts debhelper dh-make

      - name: Clone caper repository
        run: |
          git clone https://git.disroot.org/jimedrand/caper

      - name: Build Debian package
        run: |
          cd caper
          make deb

      - name: Remove old Caper Debian package
        run: |
          rm -f *.deb

      - name: Move new package to repository root
        run: |
          cp caper/*.deb .

      - name: Commit and push new package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.deb
          git commit -m "Update Caper Debian package"
          git push
