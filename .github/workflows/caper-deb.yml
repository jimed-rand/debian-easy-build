name: Build Caper Debian Package

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/caper-deb.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev

      - name: Clone caper repository
        run: |
          git clone https://git.disroot.org/jimedrand/caper

      - name: Build Debian package
        run: |
          cd caper
          make deb

      - name: Replace Caper Debian package
        run: |
          mkdir -p caper-deb
          rm -f caper-deb/*.deb
          cp caper/*.deb caper-deb/

      - name: Commit and push new package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add caper-deb/*.deb
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "Update Caper Debian package"
          git push
